name: Release
# Push a tag such as v2 to build the launcher + mod and publish CubeNova.zip as a GitHub release.
# The launcher's auto-updater downloads CubeNova.zip from the latest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check v.txt matches the tag
        shell: pwsh
        run: |
          $v = (Get-Content v.txt -Raw).Trim()
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($v -ne $tag) { Write-Error "v.txt is '$v' but the tag is '$tag'. Update v.txt first."; exit 1 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build the mod
        working-directory: mod
        run: gradle build --no-daemon

      - name: Build the mod for 1.21.4 (JDK 21 is still active here)
        working-directory: mod-1.21.4
        run: gradle build --no-daemon

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build the mod for 26.2
        working-directory: mod-26.2
        run: gradle build --no-daemon

      - name: Put the mod jars into the launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force CubeNova/builtin | Out-Null
          Copy-Item mod/build/libs/cubenova-client-*.jar CubeNova/builtin/
          Copy-Item mod-1.21.4/build/libs/cubenova-client-*.jar CubeNova/builtin/
          Copy-Item mod-26.2/build/libs/cubenova-client-*.jar CubeNova/builtin/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish the launcher
        run: dotnet publish CubeNova/CubeNova.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CubeNova.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: CubeNova.zip
